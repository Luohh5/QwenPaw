name: Remaining plugin operation cost sampling

on:
  push:
    branches: [diagnostic/windows-remaining-cost-20261030]
    paths:
      - .github/workflows/windows-remaining-cost-probe.yml
      - .ci-probes/remaining_cost_probe.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    name: Cost sample / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci-probes
    steps:
      - uses: actions/checkout@v4
      - name: Select isolated diagnostic state paths
        run: |
          echo "QWENPAW_WORKING_DIR=$RUNNER_TEMP/cost-work" >> "$GITHUB_ENV"
          echo "QWENPAW_SECRET_DIR=$RUNNER_TEMP/cost-secrets" >> "$GITHUB_ENV"
          echo "QWENPAW_DEPENDENCY_STATE_DIR=$RUNNER_TEMP/cost-state" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the same full Python dependency set
        id: install
        run: |
          python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          python -m pip install -e '.[dev,test,full]' 'setuptools<82'
          mkdir -p cost-results
          git rev-parse HEAD > cost-results/commit.txt
          python -VV > cost-results/python.txt
          python -m pip list --format=json > cost-results/pip-list.json
      - name: Original six operations without sampler
        id: original
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --no-cov --durations=12 \
            --junitxml=cost-results/original.xml \
            --basetemp="$RUNNER_TEMP/cost-tests-original" \
            'tests/unit/plugins/test_sdk_install_transaction.py::test_install_config_disable_upgrade_uninstall_preserves_user_data' \
            'tests/unit/plugins/test_sdk_channel_routing_contract.py::test_channel_stop_retains_provider_tail_and_other_run' \
            'tests/unit/plugins/test_plugin_reload.py::test_reload_ignores_same_size_same_mtime_bytecode[None-False]' \
            'tests/unit/plugins/test_plugin_reload.py::test_failed_reload_preserves_user_symlinks_and_external_data[root]' \
            'tests/unit/plugins/test_plugin_process.py::test_shared_upgrade_replaces_provider_or_restores_exact_old_tree[False]' \
            'tests/unit/plugins/test_plugin_process.py::test_cancelled_late_maintenance_entry_clears_own_marker' \
            2>&1 | tee cost-results/original.log
      - name: Sample original operations without changing decisions
        id: profiled
        if: always() && steps.install.outcome == 'success'
        env:
          QWENPAW_COST_PROFILE: '1'
          QWENPAW_COST_REPORT: cost-results/profile.json
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --no-cov -p remaining_cost_probe --durations=12 \
            --junitxml=cost-results/profile.xml \
            --basetemp="$RUNNER_TEMP/cost-tests-profile" \
            'tests/unit/plugins/test_sdk_install_transaction.py::test_install_config_disable_upgrade_uninstall_preserves_user_data' \
            'tests/unit/plugins/test_sdk_channel_routing_contract.py::test_channel_stop_retains_provider_tail_and_other_run' \
            'tests/unit/plugins/test_plugin_reload.py::test_reload_ignores_same_size_same_mtime_bytecode[None-False]' \
            'tests/unit/plugins/test_plugin_reload.py::test_failed_reload_preserves_user_symlinks_and_external_data[root]' \
            'tests/unit/plugins/test_plugin_process.py::test_shared_upgrade_replaces_provider_or_restores_exact_old_tree[False]' \
            'tests/unit/plugins/test_plugin_process.py::test_cancelled_late_maintenance_entry_clears_own_marker' \
            2>&1 | tee cost-results/profile.log
      - name: Warm control with identical sampler imports and no wrappers
        if: always() && steps.install.outcome == 'success'
        env:
          QWENPAW_COST_PROFILE: '0'
          QWENPAW_COST_REPORT: cost-results/warm-control.json
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider --no-cov -p remaining_cost_probe --durations=12 \
            --junitxml=cost-results/warm-control.xml \
            --basetemp="$RUNNER_TEMP/cost-tests-warm" \
            'tests/unit/plugins/test_sdk_install_transaction.py::test_install_config_disable_upgrade_uninstall_preserves_user_data' \
            'tests/unit/plugins/test_sdk_channel_routing_contract.py::test_channel_stop_retains_provider_tail_and_other_run' \
            'tests/unit/plugins/test_plugin_reload.py::test_reload_ignores_same_size_same_mtime_bytecode[None-False]' \
            'tests/unit/plugins/test_plugin_reload.py::test_failed_reload_preserves_user_symlinks_and_external_data[root]' \
            'tests/unit/plugins/test_plugin_process.py::test_shared_upgrade_replaces_provider_or_restores_exact_old_tree[False]' \
            'tests/unit/plugins/test_plugin_process.py::test_cancelled_late_maintenance_entry_clears_own_marker' \
            2>&1 | tee cost-results/warm-control.log
      - name: Keep original assertions and measured evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-cost-${{ matrix.os }}
          path: cost-results/
          retention-days: 7
