name: Creator 8595 frozen Windows diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and extract the reported desktop release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/reported | Out-Null
          curl.exe --fail --location --retry 2 --output dist/reported-setup.exe 'https://github.com/agentscope-ai/QwenPaw/releases/download/v2.3.0-beta.2/QwenPaw-Tauri-2.3.0b2-Windows-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          7z x -y -odist/reported dist/reported-setup.exe | Select-Object -Last 15
          if ($LASTEXITCODE -ne 0) { throw 'Release extraction failed' }
      - name: Reproduce against the real released frozen backend
        shell: pwsh
        run: python diagnostics/creator8595/run_desktop.py --root dist/reported --label released-2.3.0b2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-8595-released
          retention-days: 3
          path: |
            diagnostic-results/**/result.json
            diagnostic-results/**/stdout.log
            diagnostic-results/**/stderr.log
            diagnostic-results/**/backend-logs/*.log
  current-frozen:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.4'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19' packaging
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tools failed' }
      - name: Build console assets
        shell: pwsh
        working-directory: console
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build:prod
          if ($LASTEXITCODE -ne 0) { throw 'Console build failed' }
      - name: Build the real PyInstaller backend and channel runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the release backend/runtime build unchanged; only omit Node
          # and the Rust desktop helper, which are outside this installation path.
          $file = 'scripts/pack-tauri/build_pyinstaller.ps1'
          $text = Get-Content $file -Raw
          $marker = 'Write-Host "== Staging bundled Node runtime =="'
          $position = $text.IndexOf($marker)
          if ($position -lt 0) { throw 'Build boundary not found' }
          Set-Content -Path $file -Value $text.Substring(0, $position) -Encoding utf8
          & ./$file
          if ($LASTEXITCODE -ne 0) { throw 'Frozen backend build failed' }
      - name: Reproduce against the current real frozen backend
        shell: pwsh
        run: python diagnostics/creator8595/run_desktop.py --root console/src-tauri/binaries --label current-frozen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-8595-current
          retention-days: 3
          path: |
            diagnostic-results/**/result.json
            diagnostic-results/**/stdout.log
            diagnostic-results/**/stderr.log
            diagnostic-results/**/backend-logs/*.log
