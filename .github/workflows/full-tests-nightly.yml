name: Temporary Feishu Windows issue 8538 diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feishu-windows:
    name: Real Feishu SDK - Windows - Python 3.11
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QWENPAW_WORKING_DIR: ${{ github.workspace }}/diagnostic-runtime/working
      QWENPAW_SECRET_DIR: ${{ github.workspace }}/diagnostic-runtime/secret
      QWENPAW_DEPENDENCY_STATE_DIR: ${{ github.workspace }}/diagnostic-runtime/dependencies
      ISSUE8538_OUTPUT: ${{ github.workspace }}/diagnostic-output
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
      - name: Install diagnostic dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          python -m pip install -e ".[test]" "lark-oapi==1.7.5" "websockets==15.0.1" "httpx==0.28.1" "aiohttp>=3.11"
      - name: Record environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostic-output | Out-Null
          python -c "import json,sys,platform,locale,os;from pathlib import Path;Path('diagnostic-output/environment.json').write_text(json.dumps({'python':sys.version,'executable':sys.executable,'platform':platform.platform(),'encoding':locale.getpreferredencoding(False),'utf8_mode':sys.flags.utf8_mode,'frozen':getattr(sys,'frozen',False),'runner_os':os.environ.get('RUNNER_OS')},indent=2),encoding='utf-8')"
          python -m pip freeze | Out-File -Encoding utf8 diagnostic-output/installed-packages.txt
          git rev-parse HEAD | Out-File -Encoding utf8 diagnostic-output/commit.txt
      - name: Run actual Feishu worker against local HTTP and WebSocket service
        shell: pwsh
        run: |
          python -m pytest diagnostics/issue8538/test_feishu_windows.py -vv --tb=long --no-cov --timeout=150 --capture=tee-sys --basetemp=diagnostic-runtime/pytest 2>&1 | Tee-Object -FilePath diagnostic-output/pytest-output.log
          $diagnosticExit = $LASTEXITCODE
          exit $diagnosticExit
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue8538-feishu-windows
          path: diagnostic-output/
          retention-days: 3
