name: BOM observer Windows targeted verification
on:
  push:
    branches: [codex/verify-bom-observer-20261109]
permissions:
  contents: read
jobs:
  bom:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record encoding environment
        run: python -c "import locale,sys; print('Python',sys.version); print('encoding',locale.getencoding()); print('UTF-8 mode',sys.flags.utf8_mode)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          python -m pip install -e ".[test]"
      - name: Run exactly four existing core cases
        run: >-
          python -m pytest
          tests/unit/plugins/test_manifest_dependencies.py::test_install_includes_every_declared_dependency
          tests/unit/plugins/test_manifest_dependencies.py::test_repair_installs_manifest_dependency_after_boot_failure
          tests/unit/plugins/test_manifest_dependencies.py::test_manifest_dependency_installs_offline_wheel_in_isolated_python
          -q --no-cov --tb=short
