name: Desktop channel identity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-channel:
    name: Desktop channel identity - Windows Python 3.11
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      QWENPAW_DEPENDENCY_STATE_DIR: ${{ github.workspace }}/diagnostic-runtime/dependencies
      QWENPAW_WORKING_DIR: ${{ github.workspace }}/diagnostic-runtime/working
      QWENPAW_SECRET_DIR: ${{ github.workspace }}/diagnostic-runtime/secrets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip>=26.2.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,test,full]" "setuptools<82"
          exit $LASTEXITCODE
      - name: Record interpreter
        shell: pwsh
        run: |
          python -c "import json,platform,sys; from packaging.tags import sys_tags; from pathlib import Path; Path('environment.json').write_text(json.dumps({'python':sys.version,'executable':sys.executable,'platform':platform.platform(),'supported_tags':[str(t) for t in sys_tags()]},indent=2),encoding='utf-8')"
      - name: Run eight focused tests
        shell: pwsh
        run: |
          python -m pytest `
            tests/unit/channels/test_channel_host.py::test_execution_preparation_yields_and_consumes_session_snapshot `
            tests/unit/channels/test_channel_host.py::test_channel_probe_rejects_runtime_abi_mismatch `
            tests/unit/channels/test_channel_host.py::test_real_agent_stream_final_reply_and_saved_session `
            tests/unit/channels/test_channel_host.py::test_channel_preflight_rechecks_metadata_read_during_probe `
            tests/unit/plugins/test_plugin_process.py::test_lifecycle_bidirectional_ipc_logs_and_repeated_stop `
            -vv --tb=long --no-cov --timeout=180 --basetemp=diagnostic-temp *>&1 | Tee-Object -FilePath pytest-output.log
          exit $LASTEXITCODE
      - name: Upload focused verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-channel-8644
          retention-days: 3
          path: |
            pytest-output.log
            environment.json
