name: Diagnose Windows installer timeout

on:
  push:
    branches: [codex/diagnose-windows-installer-timeout]

permissions:
  contents: read

jobs:
  process-exit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip

      - name: Install test dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[dev,test,full]" "setuptools<82" "psutil==7.2.2" "pytest==9.2.0" "pytest-repeat==0.9.4"

      - name: Repeat original timeout and cancellation tests
        run: |
          $case = 'tests/unit/plugins/test_dependency_install_shutdown.py::test_installer_reaps_stubborn_child_after_parent_exits'
          python -m pytest $case -k 'timeout-None or cancel-None' --count=20 --timeout=25 -q --tb=short *> "timeout-baseline.log"
          $result = $LASTEXITCODE
          Get-Content "timeout-baseline.log"
          exit $result

      - name: Verify timeout and cancellation with native process handles
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'scripts/diagnostics'
          $case = 'tests/unit/plugins/test_dependency_install_shutdown.py::test_installer_reaps_stubborn_child_after_parent_exits'
          python -m pytest $case -k 'timeout-None or cancel-None' -p windows_installer_timeout --count=20 --timeout=25 -q -s --tb=short *> "timeout-handle.log"
          $result = $LASTEXITCODE
          Get-Content "timeout-handle.log"
          exit $result

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: windows-installer-timeout
          path: timeout-*.log
          retention-days: 7
          if-no-files-found: ignore
