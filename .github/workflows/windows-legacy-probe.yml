name: Windows legacy plugin diagnostic
on:
  push:
    branches: [diagnostic/windows-legacy-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-unit:
    name: Windows worker and lifecycle regressions
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          python -m pip install -e '.[dev,test,full]' 'setuptools<82'
      - name: Verify old failures and core process lifecycle
        run: |
          python - <<'PYTEST'
          import json, subprocess, sys
          nodes = json.load(open('windows-nodes.json'))
          nodes.extend([
              'tests/unit/plugins/test_plugin_process.py::test_host_exit_reaps_uncooperative_process_tree',
              'tests/unit/plugins/test_plugin_process.py::test_lifecycle_bidirectional_ipc_logs_and_repeated_stop',
              'tests/unit/plugins/test_plugin_process.py::test_crash_restarts_generation_and_retains_host_handler',
              'tests/unit/plugins/test_plugin_process.py::test_cancel_inflight_call_cleans_up_and_next_request_succeeds',
              'tests/unit/plugins/test_plugin_process.py::test_large_text_and_attachment_payload_roundtrip_is_exact',
          ])
          raise SystemExit(subprocess.call([sys.executable, '-m', 'pytest', '-vv', '-s', '--no-cov', '--durations=15', '--junitxml=windows-unit.xml', *nodes]))
          PYTEST
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-results
          path: windows-unit.xml
