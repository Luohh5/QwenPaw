name: Windows legacy plugin diagnostic
on:
  push:
    branches: [diagnostic/windows-legacy-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-unit:
    name: Windows worker and lifecycle regressions
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          python -m pip install -e '.[dev,test,full]' 'setuptools<82'
      - name: Enable temporary worker diagnostics
        run: python windows_unit_diagnostics.py
      - name: Compare inherited and DEVNULL SDK stdin
        run: |
          python - <<'PYTEST'
          import json, subprocess, sys
          from pathlib import Path
          nodes = [
              'tests/unit/plugins/test_plugin_process.py::test_forced_stop_reaps_uncooperative_process_tree',
              'tests/unit/plugins/test_plugin_process.py::test_host_exit_reaps_uncooperative_process_tree',
          ]
          worker = Path('tests/channel_support/worker.py')
          baseline = worker.read_text()
          marker = '                # DIAGNOSTIC_SDK_STDIN\n'
          assert baseline.count(marker) == 1
          results = {}
          try:
              for case in ('inherited', 'devnull'):
                  worker.write_text(baseline.replace(marker, '                stdin=subprocess.DEVNULL,\n' if case == 'devnull' else ''))
                  print('DIAGNOSTIC SDK STDIN CASE:', case, flush=True)
                  results[case] = subprocess.call([sys.executable, '-m', 'pytest', '-vv', '-s', '--no-cov', '--durations=15', f'--junitxml=windows-{case}.xml', *nodes])
          finally:
              worker.write_text(baseline)
              Path('windows-stdin-ab.json').write_text(json.dumps(results, indent=2))
          print('DIAGNOSTIC SDK STDIN RESULTS:', results, flush=True)
          raise SystemExit(results['devnull'])
          PYTEST
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-results
          path: |
            windows-*.xml
            windows-stdin-ab.json
